; https://docs.platformio.org/page/projectconf.html

[env:nodemcu-32s]
platform = espressif32@6.8.1
board = esp32dev
framework = arduino
lib_deps =
	brunolnetto/Ultrasonic-HC-SR04@^1.0.0
	madhephaestus/ESP32Servo@^0.9.0
	dlloydev/ESP32 ESP32S2 AnalogWrite@^5.0.2
	https://github.com/sdsmt-robotics/srt2022-battery-sense#master
	https://github.com/sdsmt-robotics/L298N
    https://github.com/sdsmt-robotics/software-libs
monitor_speed = 115200
